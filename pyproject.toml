[project]
name = "renpho-api-generic-logic-skill"
version = "0.2.1"
description = "RENPHO Health の非公式APIを扱うときの一般的な判断と、APIを呼ぶ道具を持つ generic-logic スキル"
requires-python = ">=3.11"
# RENPHOの非公式APIはリクエスト/レスポンスをAES-128(ECB)で暗号化しており、
# 標準ライブラリだけでは復号できない。ここが唯一のサードパーティ依存。
dependencies = [
    "pycryptodome>=3.20",
]

[tool.uv]
# スクリプト置き場であってライブラリではないので、ビルド対象にしない。
package = false
